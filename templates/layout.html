<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7945621150033029"
        crossorigin="anonymous"></script>
    <script data-collect-dnt="true" async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
    <noscript><img src="https://queue.simpleanalyticscdn.com/noscript.gif?collect-dnt=true" alt=""
            referrerpolicy="no-referrer-when-downgrade" /></noscript>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>{{block "title" .}}Lunar Letters{{end}}</title>
    <meta name="description" content="{{block " description" .}}Read novels online at Lunar Letters{{end}}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/main.css">
    <script src="/assets/main.js" defer></script>
    <script>
        (function () {
            const saved = localStorage.getItem('theme');
            const dark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
        })();
    </script>
</head>

<body class="d-flex flex-column min-vh-100">
    <!-- Header -->
    <nav class="navbar navbar-expand-md sticky-top ll-navbar">
        <div class="container">
            <a class="navbar-brand ll-brand" href="/">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"
                        fill="currentColor" />
                </svg>
                <span>Lunar Letters</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse"
                data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <i class="bi bi-list fs-3"></i>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto align-items-md-center gap-md-1">
                    <li class="nav-item"><a class="nav-link ll-nav-link" href="/"><i
                                class="bi bi-house-door me-1"></i>Home</a></li>
                    <li class="nav-item"><a class="nav-link ll-nav-link" href="/library"><i
                                class="bi bi-book me-1"></i>My Library</a></li>
                    <li class="nav-item ms-md-2">
                        <button class="btn btn-sm btn-outline-secondary rounded-circle theme-toggle"
                            data-theme-toggle type="button" aria-label="Toggle theme"
                            style="width:38px;height:38px;">
                            <i class="bi bi-moon-stars-fill"></i>
                            <i class="bi bi-sun-fill"></i>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main content -->
    <main class="flex-grow-1">
        {{template "content" .}}
    </main>

    <!-- Footer -->
    <footer class="site-footer mt-5 py-4">
        <div class="container text-center">
            <nav class="d-flex flex-wrap justify-content-center gap-3 mb-3">
                <a href="/about.html">About Us</a>
                <a href="/contact.html">Contact Us</a>
                <a href="/privacy.html">Privacy Policy</a>
                <a href="/cookies.html">Cookie Policy</a>
                <a href="/terms.html">Terms of Service</a>
            </nav>
            <p class="text-secondary small mb-0">&copy; Lunar Letters. All rights reserved.</p>
        </div>
    </footer>
</body>

</html>
