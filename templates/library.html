{{define "title"}}My Library - Lunar Letters{{end}}

{{define "content"}}
<div class="container py-4" style="max-width: 760px;">
    <h1 class="fw-bold mb-3">My Library</h1>

    <!-- Tabs -->
    <ul class="nav nav-pills mb-3 gap-2" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#lib-panel-bookmarks" type="button"
                role="tab"><i class="bi bi-bookmark me-1"></i>Bookmarks</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#lib-panel-history" type="button"
                role="tab"><i class="bi bi-clock-history me-1"></i>History</button>
        </li>
    </ul>

    <div class="tab-content">
        <!-- Bookmarks -->
        <div class="tab-pane fade show active" id="lib-panel-bookmarks" role="tabpanel">
            <div class="text-center text-secondary py-5" id="bookmarks-empty">
                <i class="bi bi-bookmark d-block mb-2" style="font-size:2.5rem;opacity:.4;"></i>
                <p class="fw-semibold mb-1">No bookmarks yet</p>
                <span class="small">Bookmark novels to see them here</span>
            </div>
            <div class="list-group" id="bookmarks-list"></div>
        </div>

        <!-- History -->
        <div class="tab-pane fade" id="lib-panel-history" role="tabpanel">
            <div class="text-center text-secondary py-5" id="history-empty">
                <i class="bi bi-clock-history d-block mb-2" style="font-size:2.5rem;opacity:.4;"></i>
                <p class="fw-semibold mb-1">No reading history</p>
                <span class="small">Chapters you read will appear here</span>
            </div>
            <div class="list-group" id="history-list"></div>
        </div>
    </div>

    <!-- Data management -->
    <div class="mt-5 pt-4 border-top">
        <h2 class="h6 text-uppercase text-secondary mb-3">Data Management</h2>
        <div class="d-flex flex-wrap gap-2">
            <button class="btn btn-outline-secondary btn-sm" id="export-btn"><i class="bi bi-download me-1"></i>Export Data</button>
            <button class="btn btn-outline-secondary btn-sm" id="import-btn"><i class="bi bi-upload me-1"></i>Import Data</button>
            <button class="btn btn-outline-danger btn-sm" id="clear-btn"><i class="bi bi-trash me-1"></i>Clear All Data</button>
        </div>
        <input type="file" id="import-file" accept=".json" class="d-none">
    </div>
</div>

<script>
    (function () {
        const DB_NAME = 'LunarLettersDB';
        const DB_VERSION = 1;
        let db = null;

        function openDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onupgradeneeded = (e) => {
                    const d = e.target.result;
                    if (!d.objectStoreNames.contains('bookmarks')) {
                        d.createObjectStore('bookmarks', { keyPath: 'slug' }).createIndex('addedAt', 'addedAt', { unique: false });
                    }
                    if (!d.objectStoreNames.contains('history')) {
                        const h = d.createObjectStore('history', { keyPath: 'id' });
                        h.createIndex('readAt', 'readAt', { unique: false });
                        h.createIndex('seriesSlug', 'seriesSlug', { unique: false });
                    }
                    if (!d.objectStoreNames.contains('progress')) {
                        d.createObjectStore('progress', { keyPath: 'seriesId' });
                    }
                };
                req.onsuccess = (e) => { db = e.target.result; resolve(db); };
                req.onerror = (e) => reject(e.target.error);
            });
        }

        const getAll = (name) => new Promise((res, rej) => {
            const r = db.transaction(name, 'readonly').objectStore(name).getAll();
            r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
        });
        const clearStore = (name) => new Promise((res, rej) => {
            const r = db.transaction(name, 'readwrite').objectStore(name).clear();
            r.onsuccess = () => res(); r.onerror = () => rej(r.error);
        });
        const putAll = (name, items) => new Promise((res, rej) => {
            const tx = db.transaction(name, 'readwrite');
            items.forEach(i => tx.objectStore(name).put(i));
            tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
        });

        async function migrateLocalStorage() {
            const raw = localStorage.getItem('reading_progress');
            if (!raw) return;
            try {
                const progress = JSON.parse(raw);
                const tx = db.transaction('progress', 'readwrite');
                for (const [seriesId, chapters] of Object.entries(progress)) {
                    tx.objectStore('progress').put({ seriesId: parseInt(seriesId), chapters });
                }
                await new Promise((res, rej) => { tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
            } catch (e) { console.warn('Migration failed:', e); }
        }

        function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
        function formatTimeAgo(ts) {
            if (!ts) return 'Unknown';
            const mins = Math.floor((Date.now() - ts) / 60000);
            if (mins < 1) return 'Just now';
            if (mins < 60) return mins + 'm ago';
            const hours = Math.floor(mins / 60);
            if (hours < 24) return hours + 'h ago';
            const days = Math.floor(hours / 24);
            if (days < 30) return days + 'd ago';
            return new Date(ts).toLocaleDateString();
        }

        function renderBookmarks(bookmarks) {
            const list = document.getElementById('bookmarks-list');
            const empty = document.getElementById('bookmarks-empty');
            if (!bookmarks.length) { empty.classList.remove('d-none'); list.innerHTML = ''; return; }
            empty.classList.add('d-none');
            list.innerHTML = bookmarks.sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0)).map(bm => `
                <div class="list-group-item d-flex align-items-center justify-content-between">
                    <a href="/novel/${bm.slug}" class="text-decoration-none text-body flex-grow-1" style="min-width:0;">
                        <div class="fw-semibold text-truncate">${escHtml(bm.title)}</div>
                        <div class="text-secondary small">${bm.author ? escHtml(bm.author) : 'Unknown Author'}</div>
                    </a>
                    <button class="btn btn-sm btn-link text-danger" data-action="remove-bookmark" data-slug="${bm.slug}" title="Remove">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>`).join('');
            list.querySelectorAll('[data-action="remove-bookmark"]').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    e.preventDefault();
                    const tx = db.transaction('bookmarks', 'readwrite');
                    tx.objectStore('bookmarks').delete(btn.dataset.slug);
                    await new Promise(r => { tx.oncomplete = r; });
                    renderBookmarks(await getAll('bookmarks'));
                });
            });
        }

        function renderHistory(history) {
            const list = document.getElementById('history-list');
            const empty = document.getElementById('history-empty');
            if (!history.length) { empty.classList.remove('d-none'); list.innerHTML = ''; return; }
            empty.classList.add('d-none');
            const grouped = {};
            history.forEach(h => {
                if (!grouped[h.seriesSlug]) grouped[h.seriesSlug] = { title: h.seriesTitle, slug: h.seriesSlug, chapters: [] };
                grouped[h.seriesSlug].chapters.push(h);
            });
            const groups = Object.values(grouped).sort((a, b) =>
                Math.max(...b.chapters.map(c => c.readAt || 0)) - Math.max(...a.chapters.map(c => c.readAt || 0)));
            list.innerHTML = groups.map(g => {
                const latest = g.chapters.sort((a, b) => (b.readAt || 0) - (a.readAt || 0))[0];
                const n = g.chapters.length;
                return `
                <a href="/novel/${g.slug}" class="list-group-item list-group-item-action d-flex align-items-center justify-content-between">
                    <div style="min-width:0;">
                        <div class="fw-semibold text-truncate">${escHtml(g.title)}</div>
                        <div class="text-secondary small">${n} chapter${n > 1 ? 's' : ''} read · ${formatTimeAgo(latest.readAt)}</div>
                    </div>
                    <i class="bi bi-chevron-right text-secondary"></i>
                </a>`;
            }).join('');
        }

        async function exportData() {
            const data = {
                version: 1, exportedAt: new Date().toISOString(),
                bookmarks: await getAll('bookmarks'), history: await getAll('history'), progress: await getAll('progress'),
            };
            const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
            const a = document.createElement('a');
            a.href = url; a.download = 'lunarletters-library-' + new Date().toISOString().slice(0, 10) + '.json';
            a.click(); URL.revokeObjectURL(url);
        }

        async function importData(file) {
            try {
                const data = JSON.parse(await file.text());
                if (data.bookmarks) await putAll('bookmarks', data.bookmarks);
                if (data.history) await putAll('history', data.history);
                if (data.progress) {
                    await putAll('progress', data.progress);
                    const ls = {};
                    (await getAll('progress')).forEach(p => { ls[p.seriesId] = p.chapters; });
                    localStorage.setItem('reading_progress', JSON.stringify(ls));
                }
                alert('Data imported successfully!');
                location.reload();
            } catch (e) { alert('Failed to import: ' + e.message); }
        }

        async function clearAllData() {
            if (!confirm('Are you sure? This will delete all your bookmarks, reading history, and progress.')) return;
            await clearStore('bookmarks'); await clearStore('history'); await clearStore('progress');
            localStorage.removeItem('reading_progress');
            alert('All data cleared.');
            location.reload();
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await openDB();
            await migrateLocalStorage();
            renderBookmarks(await getAll('bookmarks'));
            renderHistory(await getAll('history'));
            document.getElementById('export-btn').addEventListener('click', exportData);
            const importFile = document.getElementById('import-file');
            document.getElementById('import-btn').addEventListener('click', () => importFile.click());
            importFile.addEventListener('change', (e) => { if (e.target.files[0]) importData(e.target.files[0]); });
            document.getElementById('clear-btn').addEventListener('click', clearAllData);
        });
    })();
</script>
{{end}}
